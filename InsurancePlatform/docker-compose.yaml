version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: insurance-platform-postgres
    environment:
      POSTGRES_USER: insurance
      POSTGRES_PASSWORD: InsuranceDev2024!
      POSTGRES_DB: InsurancePlatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: insurance-platform-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: insurance-platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: insurance
      RABBITMQ_DEFAULT_PASS: InsuranceDev2024!
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: